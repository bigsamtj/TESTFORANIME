<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Cybersecurity forensic bug sorting animation." />
  <title>Forensic Bug Sorting Animation</title>
  <link rel="preload" as="image" href="assets/frame-01-detection.png">
  <link rel="preload" as="image" href="assets/frame-02-extraction.png">
  <link rel="preload" as="image" href="assets/frame-03-deployment.png">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <section class="forensic-animation" id="forensicAnimation" aria-label="Forensic bug sorting animation">
      <div class="animation-shell">
        <div class="frame-stack" aria-hidden="true">
          <img class="frame frame--1 is-active" src="assets/frame-01-detection.png" alt="" />
          <img class="frame frame--2" src="assets/frame-02-extraction.png" alt="" />
          <img class="frame frame--3" src="assets/frame-03-deployment.png" alt="" />
        </div>

        <div class="overlay">
          <div class="status-pill" id="statusPill">
            <span class="status-dot"></span>
            <span id="statusText">THREAT DETECTION</span>
          </div>

          <div class="frame-meta">
            <span id="frameNumber">01</span>
            <span class="meta-divider"></span>
            <span id="frameLabel">DETECTION</span>
          </div>

          <div class="timeline" aria-label="Animation progress">
            <div class="timeline-track">
              <div class="timeline-progress" id="timelineProgress"></div>
            </div>
            <div class="timeline-labels">
              <span>SCAN</span>
              <span>EXTRACT</span>
              <span>ISOLATE</span>
            </div>
          </div>
        </div>
      </div>

      <div class="controls" aria-label="Animation controls">
        <button class="control-btn" id="playBtn" type="button" aria-label="Pause animation">Pause</button>
        <button class="control-btn" id="restartBtn" type="button">Restart</button>
        <label class="speed-control">
          <span>Speed</span>
          <select id="speedSelect">
            <option value="1">1×</option>
            <option value="0.75">0.75×</option>
            <option value="0.5">0.5×</option>
            <option value="1.5">1.5×</option>
          </select>
        </label>
      </div>
    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
